name: Build iOS & iPadOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-ipa:
    name: Build iPadOS / iOS IPA Package
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor iOS Project
        run: |
          npx cap sync ios
          sed -i '' 's/swift-tools-version: 6.2/swift-tools-version: 6.0/g' ios/App/CapApp-SPM/Package.swift || true
          sed -i '' 's/\.v26/\.v18/g' ios/App/CapApp-SPM/Package.swift || true
          sed -i '' 's/\.v17/\.v18/g' ios/App/CapApp-SPM/Package.swift || true
          sed -i '' 's/\.v16/\.v18/g' ios/App/CapApp-SPM/Package.swift || true
          sed -i '' 's/26\.0/18.0/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/17\.0/18.0/g' ios/App/App.xcodeproj/project.pbxproj || true
          sed -i '' 's/16\.0/18.0/g' ios/App/App.xcodeproj/project.pbxproj || true
          python3 -c "
          p = 'ios/App/App.xcodeproj/project.pbxproj'
          s = open(p).read()
          s = s.replace('A1B2C3D40000000000000018 /* Embed Foundation Extensions */,', '')
          s = s.replace('A1B2C3D40000000000000049 /* Embed Watch Content */,', '')
          s = s.replace('A1B2C3D40000000000000019 /* PBXTargetDependency */,', '')
          s = s.replace('A1B2C3D4000000000000004B /* PBXTargetDependency */,', '')
          s = s.replace('A1B2C3D4000000000000007E /* PBXTargetDependency */,', '')
          open(p, 'w').write(s)
          " || true

      - name: Archive iOS Application
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p dist
          mkdir -p Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app Payload/
          zip -r -9 dist/Atlas-iPad-Unsigned.ipa Payload
          echo "IPA Package generated at dist/Atlas-iPad-Unsigned.ipa"
          ls -lh dist/Atlas-iPad-Unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Atlas-iPad-Unsigned.ipa
          path: dist/Atlas-iPad-Unsigned.ipa
          retention-days: 14
