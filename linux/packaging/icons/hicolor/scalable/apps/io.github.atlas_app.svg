<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242427"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7"/>
      <stop offset="100%" stop-color="#E2DCD5"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="#3F3F46" stroke-width="4"/>

  <!-- Subtle Blueprint / Grid Lines in Background -->
  <g stroke="#323236" stroke-width="1.5" stroke-dasharray="4 8" opacity="0.6">
    <line x1="96" y1="96" x2="416" y2="96"/>
    <line x1="96" y1="176" x2="416" y2="176"/>
    <line x1="96" y1="256" x2="416" y2="256"/>
    <line x1="96" y1="336" x2="416" y2="336"/>
    <line x1="96" y1="416" x2="416" y2="416"/>
    <line x1="96" y1="96" x2="96" y2="416"/>
    <line x1="176" y1="96" x2="176" y2="416"/>
    <line x1="256" y1="96" x2="256" y2="416"/>
    <line x1="336" y1="96" x2="336" y2="416"/>
    <line x1="416" y1="96" x2="416" y2="416"/>
  </g>

  <!-- Open Atlas Notebook Folio / Chevron Shape -->
  <g filter="url(#subtleShadow)">
    <!-- Left Leaf / Apex -->
    <path d="M 256 120 L 140 376 C 136 385 145 394 154 390 L 256 348 Z" fill="url(#strokeGrad)"/>
    <!-- Right Leaf / Apex -->
    <path d="M 256 120 L 256 348 L 358 390 C 367 394 376 385 372 376 Z" fill="#D6CEBE"/>
    <!-- Inner Crossbar / Horizon Line -->
    <polygon points="196,280 316,280 256,236" fill="url(#accentGrad)"/>
    <!-- Central Meridian Spine Line -->
    <line x1="256" y1="120" x2="256" y2="348" stroke="#A8A29E" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Precision Craft Pivot Dot -->
  <circle cx="256" cy="120" r="10" fill="url(#accentGrad)" stroke="#FAFAF9" stroke-width="2.5"/>
</svg>
